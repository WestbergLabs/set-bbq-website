<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Orders | South East Texas BBQ & Catering</title>
<link rel="stylesheet" href="css/style.css">
<style>
.admin-wrap{max-width:1200px;margin:0 auto;padding:2.5rem 1.25rem 4rem}
.admin-toolbar{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1.25rem}
.admin-toolbar h1{margin:.15rem 0 0;font-family:Georgia,"Times New Roman",serif}
.admin-actions{display:flex;align-items:center}.admin-actions button{padding:.65rem .9rem;border:1px solid #c7462b;background:#c7462b!important;color:#fff!important;border-radius:4px;cursor:pointer;font:inherit;font-weight:700;min-width:90px}.admin-actions button:hover{background:#a93823}.admin-toolbar{position:relative}.admin-filters{display:flex;gap:.6rem;align-items:center}
.admin-filters input,.admin-filters select{padding:.65rem .75rem;border:1px solid var(--line);background:var(--white);border-radius:4px}
.orders-table-wrap{overflow-x:auto;background:var(--white);border-top:3px solid var(--brand-red);box-shadow:0 4px 18px rgba(0,0,0,.05)}
.orders-table{width:100%;border-collapse:collapse;min-width:820px}
.orders-table th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:.75rem .8rem;border-bottom:1px solid var(--line);white-space:nowrap}
.orders-table td{padding:.8rem;border-bottom:1px solid var(--line);vertical-align:middle}
.orders-table tbody tr{cursor:pointer}.orders-table tbody tr:hover{background:#fafafa}
.status-pill{display:inline-block;padding:.25rem .55rem;border-radius:999px;font-size:.72rem;font-weight:800;text-transform:capitalize;background:#eee}
.order-link{font-weight:800;color:var(--brand-red)}
.admin-empty{padding:2rem;text-align:center;color:var(--muted)}
.order-detail{margin-top:1.5rem;display:none}.order-detail.open{display:block}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.detail-card{background:var(--white);border:1px solid var(--line);padding:1.1rem 1.2rem}
.detail-card h3{margin:0 0 .7rem;font-family:Georgia,"Times New Roman",serif}
.detail-card p{margin:.35rem 0}.detail-card strong{display:inline-block;min-width:105px}
.detail-items{width:100%;border-collapse:collapse}.detail-items th,.detail-items td{text-align:left;padding:.45rem 0;border-bottom:1px solid var(--line)}
.detail-items th:last-child,.detail-items td:last-child{text-align:right}
.detail-total{text-align:right;font-size:1.2rem;margin-top:1rem}
@media(max-width:780px){.admin-toolbar{align-items:stretch;flex-direction:column}.admin-filters{width:100%;flex-direction:column}.admin-filters>*{width:100%}.detail-grid{grid-template-columns:1fr}.admin-wrap{padding-top:1.5rem}}
</style>
</head>
<body>
<header class="site-header">
<div class="container nav-wrap">
<a href="index.html" class="brand" aria-label="South East Texas BBQ home"><img src="images/logo/SET_Logo.png" alt="South East Texas BBQ & Catering logo" class="brand-logo"></a>
<nav class="main-nav" aria-label="Main navigation">
<a href="index.html">Home</a><a href="menu.html">Menu</a><a href="catering.html">Catering</a><a href="order.html">Order</a><a href="contact.html">Contact</a>
</nav>
</div>
</header>
<main class="admin-wrap">
<div class="admin-toolbar">
<div><div class="eyebrow">Catering Orders</div><h1>Orders</h1></div>
<div class="admin-actions"><button id="logoutBtn" type="button">Log Out</button></div><div class="admin-filters"><input id="search" type="search" placeholder="Search orders..."><select id="status"><option value="">All statuses</option><option>new</option><option>contacted</option><option>confirmed</option><option>completed</option><option>cancelled</option></select></div>
</div>
<div class="orders-table-wrap"><table class="orders-table"><thead><tr><th>Order</th><th>Event</th><th>Event Date</th><th>Customer</th><th>Guests</th><th>Total</th><th>Status</th></tr></thead><tbody id="ordersBody"></tbody></table><div id="empty" class="admin-empty" hidden>No orders found.</div></div>
<section id="detail" class="order-detail"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://klgshthkszosfgxhjctv.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_BnPEvNiXBsUNpUs-j3eBHQ_gGKsWXNU';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let orders=[],items=[];
const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v||0));
const date=v=>v?new Date(v).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function render(){const q=document.getElementById('search').value.toLowerCase(),st=document.getElementById('status').value;const rows=orders.filter(o=>(!st||o.status===st)&&(!q||[o.order_number,o.event_name,o.contact_name,o.email,o.phone].some(x=>String(x||'').toLowerCase().includes(q))));document.getElementById('ordersBody').innerHTML=rows.map(o=>`<tr onclick="showOrder('${o.id}')"><td class="order-link">#${esc(o.order_number)}</td><td>${esc(o.event_name||'—')}</td><td>${esc(date(o.event_date))}</td><td>${esc(o.contact_name)}</td><td>${esc(o.guest_count||'—')}</td><td><strong>${money(o.total)}</strong></td><td><span class="status-pill">${esc(o.status)}</span></td></tr>`).join('');document.getElementById('empty').hidden=rows.length>0}
function showOrder(id){const o=orders.find(x=>x.id===id),its=items.filter(x=>x.order_id===id);if(!o)return;const d=document.getElementById('detail');d.className='order-detail open';d.innerHTML=`<div class="detail-grid"><div class="detail-card"><h3>Customer & Event</h3><p><strong>Customer</strong>${esc(o.contact_name)}</p><p><strong>Email</strong>${esc(o.email)}</p><p><strong>Phone</strong>${esc(o.phone||'—')}</p><p><strong>Event</strong>${esc(o.event_name||'—')}</p><p><strong>Date</strong>${esc(date(o.event_date))}</p><p><strong>Guests</strong>${esc(o.guest_count||'—')}</p><p><strong>Address</strong>${esc(o.venue_address||'—')}</p></div><div class="detail-card"><h3>Order</h3><table class="detail-items"><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>${its.map(i=>`<tr><td>${esc(i.item_name)}${i.option?' — '+esc(i.option):''}</td><td>${esc(i.quantity)}</td><td>${money(i.unit_price)}</td><td>${money(i.line_total)}</td></tr>`).join('')}</tbody></table><p><strong>Meats</strong>${money(o.subtotal_meats)}</p><p><strong>Sides</strong>${money(o.subtotal_sides)}</p><p><strong>Delivery</strong>${money(o.delivery_fee)}</p><div class="detail-total"><strong>Total: ${money(o.total)}</strong></div></div></div>${o.special_requests?`<div class="detail-card" style="margin-top:1rem"><h3>Special Requests</h3><p>${esc(o.special_requests)}</p></div>`:''}`}
async function logout(){await sb.auth.signOut();location.reload()}
async function load(){
  let {data:{session}}=await sb.auth.getSession();
  if(session){ const refreshed=await sb.auth.refreshSession(); if(refreshed.data.session) session=refreshed.data.session; }
  if(!session){
    document.getElementById('ordersBody').innerHTML='<tr><td colspan="7" style="text-align:center;padding:2rem">Please sign in to view orders.</td></tr>';
    document.getElementById('detail').innerHTML='<div class="detail-card"><h3>Admin Sign In</h3><form id="loginForm"><p><input id="email" type="email" placeholder="Email" required style="width:100%;padding:.7rem"></p><p><input id="password" type="password" placeholder="Password" required style="width:100%;padding:.7rem"></p><button type="submit">Sign In</button><p id="loginError" style="color:#b43a26"></p></form></div>';
    document.getElementById('detail').className='order-detail open';
    document.getElementById('loginForm').onsubmit=async e=>{
      e.preventDefault();
      const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});
      if(error){document.getElementById('loginError').textContent=error.message;return}
      location.reload();
    };
    return;
  }
  const base=SUPABASE_URL+'/rest/v1/';
  const headers={apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+session.access_token};
  const [a,b]=await Promise.all([sb.from('orders').select('*').order('event_date',{ascending:false}),sb.from('order_items').select('*').order('id',{ascending:true})]);
  if(a.error||b.error){document.getElementById('empty').hidden=false;document.getElementById('empty').textContent=`You are signed in, but orders could not be loaded: ${(a.error||b.error).message}`;return}
  orders=a.data||[];items=b.data||[];render();
}
document.getElementById('search').oninput=render;document.getElementById('status').onchange=render;document.getElementById('logoutBtn').onclick=logout;load();
</script>
</body></html>
