    <path d="M1110 500 C1050 420 1200 390 1135 325 C1070 260 1230 225 1170 165 C1115 110 1250 65 1210 5" stroke-width="130" opacity="0.28"/>
    <path d="M1435 500 C1380 430 1515 390 1455 325 C1395 260 1535 230 1480 170 C1430 115 1560 65 1530 0" stroke-width="110" opacity="0.30"/>
  </g>

  <g fill="url(#cloud)" filter="url(#smokeB)">
