<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="smokeA" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.035" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="55" xChannelSelector="R" yChannelSelector="G" result="distorted"/>
      <feGaussianBlur in="distorted" stdDeviation="10"/>
    </filter>
    <filter id="smokeB" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.05" numOctaves="3" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="38" xChannelSelector="R" yChannelSelector="G" result="distorted"/>
      <feGaussianBlur in="distorted" stdDeviation="5"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.72"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g fill="none" stroke="url(#fade)" stroke-linecap="round" filter="url(#smokeA)">
    <path d="M110 500 C70 430 210 400 145 345 C75 285 220 265 170 210 C120 155 255 120 215 35" stroke-width="105" opacity="0.34"/>
    <path d="M400 500 C345 425 495 390 425 325 C350 255 525 235 460 175 C405 125 535 90 500 10" stroke-width="125" opacity="0.28"/>
